# Place this file at .github/workflows/publish-to-iskra-firmware.yml in EACH
# firmware repo (ci-clop-firmware, venovisor-firmware, ...).
#
# WHY THIS EXISTS
# Operators must be able to flash production firmware without being given the
# firmware source. GitHub read access is repository-wide - there is no
# "releases only" permission - so the separation has to be a separate
# repository. This workflow copies the built artefacts of a release into the
# shared distribution repo, which is the only repo approved operators can read.
#
# The source repo, its history, and its CI stay private to you.
#
# WHAT IT DOES
# On `release: published` in this repo, it re-uploads that release's assets to
#   Energy-for-Ukraine/iskra-firmware
# under the tag  <product-id>-v<version>  (namespaced, because one distribution
# repo serves every product and two products can share a version number).
#
# It can also be run manually against an existing tag via the Actions tab, so
# the publish path can be proven before a real release depends on it.
#
# AUTHENTICATION
# A short-lived GitHub App installation token, minted per run. Nothing
# long-lived is stored, and there is no PAT expiry date to be surprised by.
#
# REQUIRED SECRETS in this firmware repo:
#   ISKRA_PUBLISH_APP_ID           the publishing App's numeric App ID
#   ISKRA_PUBLISH_APP_PRIVATE_KEY  that App's .pem private key, whole file
#
# The publishing App MUST be a separate App from Iskra Flasher. Iskra Flasher is
# what operators authorise through Device Flow, and a user token is bounded by
# the App's permissions - so `contents: read` there is exactly what stops a
# stolen operator token from tampering with firmware. Granting it write would
# hand every approved operator the ability to overwrite production artefacts.
#
# Set up the publishing App with:
#   Repository permissions: Contents = Read and write, Metadata = Read-only
#   Installed on: Energy-for-Ukraine/iskra-firmware ONLY

name: publish firmware to iskra-firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag in this repo to publish (e.g. v1.0.3)'
        required: true
        type: string

# Read-only against this repo. Writing to the distribution repo uses the App token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Scoped to the distribution repo alone, and expires in an hour. A
      # compromised run cannot reach back into firmware source.
      - name: Mint a distribution-repo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.ISKRA_PUBLISH_APP_ID }}
          private-key: ${{ secrets.ISKRA_PUBLISH_APP_PRIVATE_KEY }}
          owner: Energy-for-Ukraine
          repositories: iskra-firmware

      - name: Copy release assets into the distribution repo
        env:
          # Release metadata is data, never shell source. Everything below is
          # passed through the environment and validated before use.
          DIST_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          DIST_REPO: Energy-for-Ukraine/iskra-firmware
        run: |
          set -euo pipefail

          if [ -z "${DIST_TOKEN:-}" ]; then
            echo "::error::could not mint a distribution token; check ISKRA_PUBLISH_APP_ID / ISKRA_PUBLISH_APP_PRIVATE_KEY" >&2
            exit 1
          fi
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::no release tag supplied" >&2
            exit 1
          fi

          # product id = this repo's name minus the -firmware suffix, matching
          # the asset naming convention the catalog generator expects.
          repo_name="${SOURCE_REPO##*/}"
          case "$repo_name" in
            *-firmware) product="${repo_name%-firmware}" ;;
            *)
              echo "::error::repo '$repo_name' does not end in -firmware" >&2
              exit 1
              ;;
          esac

          # Refuse anything that is not v<semver>. A stray tag would otherwise
          # become a catalog entry pointing at an artefact nobody reviewed.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release tag '$RELEASE_TAG' is not v<semver>" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          dist_tag="${product}-v${version}"

          echo "Publishing ${SOURCE_REPO}@${RELEASE_TAG} -> ${DIST_REPO}@${dist_tag}"

          mkdir -p dist-assets
          cd dist-assets

          # Download this release's assets using the workflow's own read token.
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPO" --clobber

          shopt -s nullglob
          assets=(*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::release $RELEASE_TAG has no assets to publish" >&2
            exit 1
          fi

          # The catalog reads target.json to learn the target stack; without it
          # the regenerated catalog would silently omit this release.
          if [ ! -f target.json ]; then
            echo "::error::release $RELEASE_TAG has no target.json asset" >&2
            exit 1
          fi

          # Every firmware artefact must follow <product>_v<version>_<part>.<ext>
          # or the generator cannot match it to this product.
          firmware_count=0
          for f in *.elf *.hex; do
            case "$f" in
              "${product}_v${version}_"*) firmware_count=$((firmware_count + 1)) ;;
              *)
                echo "::error::asset '$f' does not match ${product}_v${version}_<part>.<ext>" >&2
                exit 1
                ;;
            esac
          done
          if [ "$firmware_count" -eq 0 ]; then
            echo "::error::release $RELEASE_TAG has no .elf or .hex artefact" >&2
            exit 1
          fi

          printf 'Publishing %d artefact(s) plus target.json\n' "$firmware_count"

          # Switch to the distribution-repo token only for the write steps.
          export GH_TOKEN="$DIST_TOKEN"

          # Immutable by policy: an existing dist tag means this version was
          # already published, and silently overwriting it would change what
          # stations flash for a version they have already seen. This also makes
          # a manual re-run safe - it stops rather than clobbering.
          if gh release view "$dist_tag" --repo "$DIST_REPO" >/dev/null 2>&1; then
            echo "::notice::${DIST_REPO} already has ${dist_tag}; nothing to do." >&2
            echo "::notice::Cut a new version rather than replacing a published one." >&2
            exit 0
          fi

          gh release create "$dist_tag" \
            --repo "$DIST_REPO" \
            --title "$product $RELEASE_TAG" \
            --notes "Built artefacts for ${SOURCE_REPO}@${RELEASE_TAG}. Source is not published here." \
            "${assets[@]}"

          printf 'Published %s to %s\n' "$dist_tag" "$DIST_REPO"
