name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iskra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  windows:
    name: Windows x64 (shipping WPF + portable app)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.301
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependency graph
        shell: pwsh
        run: dotnet restore Iskra.sln --locked-mode --nologo

      - name: Build shipping solution
        shell: pwsh
        run: dotnet build Iskra.sln -c Release --no-restore --nologo -warnaserror

      - name: Run all tests
        shell: pwsh
        run: dotnet test Iskra.sln -c Release --no-build --no-restore --nologo

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $audit = (& dotnet list Iskra.sln package --vulnerable --include-transitive --no-restore --format json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit failed" }
          $audit | Write-Host
          if ($audit -match '"vulnerabilities"\s*:') {
            throw "NuGet reported one or more vulnerable dependencies"
          }

      - name: Publish and smoke-test CLI
        shell: pwsh
        run: |
          dotnet publish src/Iskra.Cli -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -o artifacts/ci-cli
          & ./artifacts/ci-cli/Iskra.Cli.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "published CLI smoke test failed" }

  portable:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            os: ubuntu-24.04
            rid: linux-x64
          - name: Ubuntu 24.04 arm64
            os: ubuntu-24.04-arm
            rid: linux-arm64
          - name: macOS 15 Apple Silicon
            os: macos-15
            rid: osx-arm64
          - name: macOS 15 Intel
            os: macos-15-intel
            rid: osx-x64

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.301
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore portable tests and applications
        shell: pwsh
        run: |
          $projects = @(
            "tests/Iskra.Core.Tests/Iskra.Core.Tests.csproj",
            "tests/Iskra.Application.Tests/Iskra.Application.Tests.csproj",
            "tests/Iskra.Desktop.Tests/Iskra.Desktop.Tests.csproj",
            "src/Iskra.Cli/Iskra.Cli.csproj",
            "src/Iskra.Desktop/Iskra.Desktop.csproj"
          )
          foreach ($project in $projects) {
            # The lock files cover the complete RID matrix. Passing -r here
            # would narrow the evaluated graph and make locked restore fail.
            dotnet restore $project --locked-mode --nologo
            if ($LASTEXITCODE -ne 0) { throw "locked restore failed: $project" }
          }

      - name: Run portable test suites natively
        shell: pwsh
        run: |
          $tests = @(
            "tests/Iskra.Core.Tests/Iskra.Core.Tests.csproj",
            "tests/Iskra.Application.Tests/Iskra.Application.Tests.csproj",
            "tests/Iskra.Desktop.Tests/Iskra.Desktop.Tests.csproj"
          )
          foreach ($project in $tests) {
            dotnet test $project -c Release -r "${{ matrix.rid }}" --no-restore --nologo -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "tests failed: $project" }
          }

      - name: Publish portable GUI and CLI
        shell: pwsh
        run: |
          dotnet publish src/Iskra.Desktop -c Release -r "${{ matrix.rid }}" `
            --self-contained true --no-restore -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true -p:DebugType=None `
            -p:DebugSymbols=false -o artifacts/ci-gui
          if ($LASTEXITCODE -ne 0) { throw "Avalonia publish failed" }
          dotnet publish src/Iskra.Cli -c Release -r "${{ matrix.rid }}" `
            --self-contained true --no-restore -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true -p:DebugType=None `
            -p:DebugSymbols=false -o artifacts/ci-cli
          if ($LASTEXITCODE -ne 0) { throw "CLI publish failed" }

      - name: Smoke-test native CLI binary
        shell: pwsh
        run: |
          chmod +x artifacts/ci-cli/Iskra.Cli
          & ./artifacts/ci-cli/Iskra.Cli --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "published CLI smoke test failed" }
